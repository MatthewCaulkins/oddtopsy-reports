<!-- Cognito > User pool > Messaging > Message templates > Verification message
     (also used for "Forgot your password?" codes).
     Verification type: Code.
     Subject: Your Oddtopsy Reports verification code
     Keep {####}: Cognito requires it. -->
<div style="margin:0;padding:24px 12px;background:#eef2f3;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #d9e1e4;border-radius:12px;">
    <tr>
      <td style="padding:18px 28px;border-bottom:3px solid #285f73;">
        <img src="https://oddtopsies.org/branding/icon.png" width="36" height="37" alt="Oddtopsy logo" style="vertical-align:middle;border:0;font-size:11px;color:#285f73;" />
        <span style="vertical-align:middle;margin-left:10px;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:bold;color:#285f73;">Oddtopsy Reports</span>
      </td>
    </tr>
    <tr>
      <td style="padding:28px;font-size:16px;line-height:1.6;color:#172026;">
        <p style="margin:0 0 16px;">Your Oddtopsy Reports verification code is <strong style="font-size:22px;letter-spacing:2px;">{####}</strong>.</p>
        <p style="margin:0;color:#5f6f78;font-size:14px;">Enter it where you were asked, for example to reset your password. If you didn't request it, you can ignore this email.</p>
      </td>
    </tr>
  </table>
</div>
