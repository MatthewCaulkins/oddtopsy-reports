services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://oddtopsy:0ddTopsy@postgres:5432/oddtopsy_reports
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: oddtopsy_reports
      POSTGRES_USER: oddtopsy
      POSTGRES_PASSWORD: 0ddTopsy
    volumes:
      - pgdata_prod_test:/var/lib/postgresql/data

volumes:
  pgdata_prod_test:
